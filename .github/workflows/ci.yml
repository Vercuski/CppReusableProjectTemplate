name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Ubuntu Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS Clang
            os: macos-latest
            cc: clang
            cxx: clang++
          - name: Windows MSVC
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ matrix.os }}-fetchcontent-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DMYPROJECT_BUILD_TESTS=ON
          -DMYPROJECT_WARNINGS_AS_ERRORS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DMYPROJECT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure --parallel

  sanitizers:
    name: Ubuntu Clang (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMYPROJECT_BUILD_TESTS=ON
          -DMYPROJECT_ENABLE_SANITIZER_ADDRESS=ON
          -DMYPROJECT_ENABLE_SANITIZER_UNDEFINED=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel

  lint:
    name: Formatting & static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy cppcheck ninja-build

      - name: Check clang-format
        run: |
          find include src apps tests \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Configure with clang-tidy and cppcheck enabled
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DMYPROJECT_BUILD_TESTS=ON
          -DMYPROJECT_ENABLE_CLANG_TIDY=ON
          -DMYPROJECT_ENABLE_CPPCHECK=ON

      - name: Build (runs clang-tidy / cppcheck)
        run: cmake --build build --parallel
